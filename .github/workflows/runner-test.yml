name: Self-Hosted Runner Test

on:
  push:
    branches:
      - test/self-hosted-runner

jobs:
  runner-test:
    runs-on: [self-hosted, docker-test]
    timeout-minutes: 90

    steps:
      - name: Show runner details
        run: |
          echo "Runner name: $RUNNER_NAME"
          echo "Hostname: $(hostname)"
          echo "OS: $(uname -a)"
          echo "CPU: $(nproc) cores"
          echo "Memory: $(free -h | awk '/^Mem:/{print $2}')"

      - name: Checkout besu-benchmarks
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Clone Besu
        run: |
          rm -rf besu
          git clone --depth 100 https://github.com/besu-eth/besu.git besu
          cd besu
          git checkout efddc0f59c534fc0269f4548afe68f1937f5ed39
          echo "BESU_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Ensure JMH writes JSON output
        working-directory: besu
        run: |
          if ! grep -q "resultFormat" build.gradle; then
            sed -i -E "/^[[:space:]]*jmh \{/a\\      resultFormat = 'JSON'" build.gradle
          fi

      - name: Run JMH Benchmarks
        working-directory: besu
        run: ./gradlew :ethereum:core:jmh --rerun-tasks -PgasProfiler=true "-Pincludes=AddOperation|CallDataCopyOperation|SStoreOperation" -Pexcludes=executeOperationWithEmptyHashCache

      - name: Show results
        run: |
          echo "Benchmarks completed on $RUNNER_NAME"
          python3 -c "
          import json
          data = json.load(open('besu/ethereum/core/build/results/jmh/results.json'))
          print(f'Total benchmarks: {len(data)}')
          "

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: runner-test-results
          path: besu/ethereum/core/build/results/jmh/results.json
          retention-days: 30
