name: EVM JMH Benchmarks

on:
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 10 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      besu_ref:
        description: 'Besu ref (branch, tag, or SHA) to benchmark'
        required: true
        default: 'main'
      besu_repo:
        description: 'Besu repository to clone'
        required: false
        default: 'besu-eth/besu'
      benchmark_filter:
        description: 'JMH include pattern — leave empty to run all benchmarks'
        required: false
        default: ''
      gas_profiler:
        description: 'Enable GasProfiler to emit gas cost as a secondary metric (requires gas profiler support in the target Besu ref)'
        required: false
        type: boolean
        default: true

jobs:
  jmh-benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      BESU_REF: ${{ inputs.besu_ref || 'efddc0f59c534fc0269f4548afe68f1937f5ed39' }}
      BESU_REPO: ${{ inputs.besu_repo || 'besu-eth/besu' }}
      BENCH_FILTER: ${{ inputs.benchmark_filter || '' }}
      GAS_PROFILER: ${{ github.event_name == 'schedule' && 'true' || inputs.gas_profiler }}

    steps:
      - name: Checkout besu-benchmarks
        uses: actions/checkout@v4
        with:
          # Don't leave the write-scoped token in .git/config where the Besu
          # build (untrusted code when besu_repo/besu_ref point elsewhere) can read it.
          # The token is supplied only to the push step below.
          persist-credentials: false

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Clone Besu
        run: |
          git clone --depth 100 "https://github.com/${BESU_REPO}.git" besu
          cd besu
          git checkout "${BESU_REF}"
          echo "BESU_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Ensure JMH writes JSON output
        working-directory: besu
        run: |
          if ! grep -q "resultFormat" build.gradle; then
            if ! grep -qE "^[[:space:]]*jmh \{" build.gradle; then
              echo "ERROR: jmh block not found in build.gradle, cannot inject resultFormat" >&2
              exit 1
            fi
            sed -i -E "/^[[:space:]]*jmh \{/a\\      resultFormat = 'JSON'" build.gradle
            echo "Patched build.gradle to set resultFormat = 'JSON'"
            grep -n "resultFormat" build.gradle
          else
            echo "build.gradle already declares resultFormat — no patch needed"
          fi

      - name: Run JMH Benchmarks
        working-directory: besu
        run: |
          # Bash array so the filter (a JMH regex, e.g. "Add.*|SStore") is passed as a
          # single argument and never word-split or glob-expanded.
          ARGS=(--rerun-tasks)
          if [ -n "${BENCH_FILTER}" ]; then
            ARGS+=("-Pincludes=${BENCH_FILTER}")
          fi
          if [ "${GAS_PROFILER}" = "true" ]; then
            ARGS+=(-PgasProfiler=true)
          fi
          ARGS+=(-Pexcludes=executeOperationWithEmptyHashCache)
          ./gradlew :ethereum:core:jmh "${ARGS[@]}"

      - name: Stage results and metadata
        run: |
          mkdir -p benchmark-output
          cp besu/ethereum/core/build/results/jmh/results.json benchmark-output/jmh-results.json
          export RUN_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export JAVA_VERSION="$(java -version 2>&1 | head -1 | tr -d '"')"
          export CPU_MODEL="$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs)"
          export CPU_CORES="$(nproc)"
          export RAM_TOTAL="$(free -h | awk '/^Mem:/{print $2}')"
          # Serialise with json.dump so quotes/backslashes in inputs can't produce invalid JSON.
          python3 - << 'EOF'
          import json, os
          e = os.environ
          meta = {
              "sha": e["BESU_SHA"],
              "ref": e["BESU_REF"],
              "besu_repo": e["BESU_REPO"],
              "date": e["RUN_DATE"],
              "run_id": e["GITHUB_RUN_ID"],
              "benchmark_filter": e.get("BENCH_FILTER") or "all",
              "runner_os": e["RUNNER_OS"],
              "runner_arch": e["RUNNER_ARCH"],
              "java_version": e["JAVA_VERSION"],
              "cpu_model": e["CPU_MODEL"],
              "cpu_cores": e["CPU_CORES"],
              "ram_total": e["RAM_TOTAL"],
          }
          with open("benchmark-output/metadata.json", "w") as f:
              json.dump(meta, f, indent=2)
              f.write("\n")
          EOF

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: jmh-results-${{ env.BESU_SHA }}
          path: benchmark-output/
          retention-days: 90

      - name: Persist results to main
        env:
          SHA: ${{ env.BESU_SHA }}
          RUN_ID: ${{ github.run_id }}
          BENCHMARK_RESULTS: ${{ github.workspace }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Credentials were not persisted at checkout; pass the token per command
          # so it never lands in .git/config.
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          echo "::add-mask::${AUTH_HEADER#AUTHORIZATION: basic }"
          git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" pull --rebase origin main
          mkdir -p "data/runs/${RUN_ID}"
          cp benchmark-output/jmh-results.json "data/runs/${RUN_ID}/results.json"
          cp benchmark-output/metadata.json    "data/runs/${RUN_ID}/metadata.json"
          python3 scripts/update_benchmark_index.py
          git add data/runs/
          git commit -m "data: add benchmark run ${SHA} (${RUN_ID})"
          git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" push origin main

      - name: Write job summary
        run: |
          BENCHMARK_COUNT=$(python3 -c "
          import json
          data = json.load(open('benchmark-output/jmh-results.json'))
          print(len(data))
          ")

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## EVM JMH Benchmark Results

          | | |
          |---|---|
          | **Besu ref** | \`${BESU_REF}\` |
          | **Besu SHA** | \`${BESU_SHA}\` |
          | **Besu repo** | \`${BESU_REPO}\` |
          | **Runner** | ${{ runner.os }} / ${{ runner.arch }} |
          | **Filter** | \`${BENCH_FILTER:-all}\` |
          | **Benchmarks recorded** | ${BENCHMARK_COUNT} |
          | **Artifact** | \`jmh-results-${BESU_SHA}\` — retained 90 days |
          | **Dashboard** | https://bomanaps.github.io/besu-benchmarks/ |

          ### How to view results
          1. Wait ~30s for GitHub Pages to redeploy
          2. Open the dashboard link above
          3. Or download the artifact and load \`jmh-results.json\` into [JMH Visualizer](http://jmh.morethan.io)
          EOF
